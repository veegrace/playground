version: '4'
services:
  sql-server-db:
    container_name: sql-server-db
    image:  mcr.microsoft.com/mssql/server:2022-latest
    environment: 
      MSSQL_SA_PASSWORD: "PeroxideAce13!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - 1433:1433
      

