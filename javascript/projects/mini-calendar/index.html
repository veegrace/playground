<!DOCTYPE html>
<html>
    <head>
        <title>Mini Calendar</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="calendar">
                <div class="left">
                    <p id="date">07</p>
                    <p id="day">Monday</p>
                </div>
                <div class="right">
                    <p id="month">October</p>
                    <p id="year">2024</p>    
                </div>
            </div>
        </div>        
        <script src="script.js"></script>
    </body>
</html>
